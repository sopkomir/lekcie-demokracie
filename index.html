<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lekcie demokracie – komiksová cesta Archívom času</title>
<meta name="description" content="Interaktívna komiksová cesta dejinami demokracie a politických myšlienok: od tlupy pri ohni cez Atény, Althing, Machiavelliho a toryov s whigmi až po dnešok. Ako spoznať extrémistov. Zavretá škola.">
<meta name="theme-color" content="#1b2a6b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Comic+Neue:wght@700&family=Cormorant+Garamond:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
/* ===== Tokeny – komiksová paleta ===== */
:root{--ink:#141414;--paper:#fff8e8;--paper2:#fdecc4;--page:#1b2a6b;--page2:#13205a;--yel:#ffd43b;--red:#ff4d4d;--cyan:#22c3e6;--mag:#ff4fa3;
 --card:var(--paper);--card2:var(--paper2);--line:var(--ink);--tx:var(--ink);--mut:#5d5444;--ok:#14975a;--bad:#e03131;--a1:#ffcc00;--a2:#ff9f1c;--sec:#22c3e6;--r:18px;--sh:5px 5px 0 var(--ink)}
body.putnik{--a1:#2fd3f0;--a2:#12a5c8}
body.kronikar{--a1:#ffcc00;--a2:#ff9f1c}
body.straz{--a1:#ff5fae;--a2:#d6338a}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;-webkit-text-size-adjust:100%}
body{min-height:100vh;line-height:1.5;font-family:'Space Grotesk',system-ui,sans-serif;color:var(--tx);background:var(--page)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
 background:radial-gradient(circle,rgba(255,255,255,.09) 1.6px,transparent 1.8px) 0 0/14px 14px,
 radial-gradient(900px 600px at 85% -10%,color-mix(in srgb,var(--a1) 30%,transparent),transparent 60%),
 radial-gradient(800px 600px at -10% 110%,rgba(255,77,77,.25),transparent 60%),
 linear-gradient(160deg,var(--page),var(--page2))}
button{font:inherit;color:inherit}
.mono{font-family:'JetBrains Mono',monospace}
.mut{color:var(--mut)}.small{font-size:.88rem}.tiny{font-size:.75rem}
b,strong{font-weight:700}
.bang{font-family:'Bangers',cursive;letter-spacing:.04em;font-weight:400}
/* ===== Hlavička ===== */
header.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--yel);border-bottom:4px solid var(--ink)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;flex:1;background:none;border:0;padding:0;text-align:left}
.brand svg{flex:none}
.brand .t{font-family:'Bangers',cursive;letter-spacing:.08em;font-size:1.35rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.brand .t span{color:var(--red);-webkit-text-stroke:1px var(--ink)}
.icbtn{width:44px;height:44px;border-radius:12px;border:3px solid var(--ink);background:#fff;display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:3px 3px 0 var(--ink);transition:transform .1s}
.icbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.icbtn svg{width:22px;height:22px}
main{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:16px 14px 80px}
/* ===== Panely a tlačidlá ===== */
.card{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);padding:18px;box-shadow:var(--sh);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:14px;border:3px solid var(--ink);cursor:pointer;font-weight:700;color:var(--ink);background:var(--a1);box-shadow:4px 4px 0 var(--ink);transition:transform .1s,box-shadow .1s;text-transform:uppercase;letter-spacing:.03em;font-size:.95rem}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.sm{min-height:42px;padding:8px 14px;font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-family:'JetBrains Mono',monospace;letter-spacing:.2em;font-size:.72rem;text-transform:uppercase;font-weight:700;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;border:2px solid var(--ink);background:#fff;font-size:.78rem;font-family:'JetBrains Mono',monospace;font-weight:700}
h1,h2,h3{font-family:'Bangers',cursive;font-weight:400;letter-spacing:.04em;line-height:1.05;margin:0}
h1{font-size:clamp(2.6rem,9vw,5rem)}
h2{font-size:clamp(1.6rem,4.6vw,2.3rem)}
h3{font-size:1.45rem}
.sec{display:flex;align-items:center;gap:12px;margin:38px 0 14px;color:#fff}
.sec h2{color:#fff;text-shadow:3px 3px 0 var(--ink);-webkit-text-stroke:1px var(--ink)}
.sec .no{flex:none;font-family:'Bangers';font-size:1.4rem;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--a1);color:var(--ink);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.cap{display:inline-block;background:var(--yel);border:3px solid var(--ink);padding:4px 10px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;box-shadow:3px 3px 0 var(--ink)}
/* bublina */
.bub{position:relative;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:12px 16px;font-family:'Comic Neue','Space Grotesk',sans-serif;font-weight:700;font-size:1.05rem;line-height:1.35}
.bub:after{content:"";position:absolute;left:24px;bottom:-16px;width:22px;height:18px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:skewX(-35deg);clip-path:polygon(0 0,100% 0,100% 100%)}
.bub.l:after{left:-14px;top:18px;bottom:auto;width:18px;height:20px;border:0;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:skewY(-30deg);clip-path:polygon(0 0,100% 100%,0 100%)}
/* výbuch */
.burst{display:inline-grid;place-items:center;font-family:'Bangers';letter-spacing:.05em;color:var(--ink);background:var(--yel);padding:22px 26px;clip-path:polygon(50% 0,61% 23%,86% 8%,78% 34%,100% 42%,79% 57%,95% 83%,67% 75%,56% 100%,44% 77%,17% 92%,23% 64%,0 55%,21% 40%,8% 12%,36% 24%);font-size:1.6rem}
/* ===== Hero – obálka ===== */
.hero{position:relative;overflow:hidden;padding:0;background:var(--paper)}
.hero .pano{position:relative;height:230px;overflow:hidden;border-bottom:3px solid var(--ink);background:#87ceeb}
.hero .pano .strip{position:absolute;left:0;top:0;height:230px;display:flex;transition:transform .8s cubic-bezier(.2,.9,.2,1)}
.hero .pano .strip svg{flex:none;width:420px;height:230px;border-right:3px solid var(--ink)}
.hero .yr{position:absolute;left:12px;bottom:10px;z-index:2}
.hero .issue{position:absolute;right:10px;top:10px;z-index:2;transform:rotate(6deg)}
.hero .body{padding:18px 18px 22px}
.hero h1{color:var(--ink);text-shadow:4px 4px 0 var(--a1)}
.hero h1 em{font-style:normal;color:var(--red);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink)}
.kron{margin-top:16px;padding:14px;border-radius:16px;background:#fff;border:3px dashed var(--ink)}
.kron label{display:block;font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.18em;color:var(--mut);margin-bottom:6px;font-weight:700}
.kron .who{font-family:'Comic Neue',sans-serif;font-weight:700;font-size:1.15rem;line-height:1.3;min-height:3em}
input[type=range]{width:100%;accent-color:var(--red);height:36px;cursor:pointer}
.lead{font-size:1.04rem;max-width:62ch}
.speedlines{position:absolute;inset:-50%;pointer-events:none;background:repeating-conic-gradient(from 0deg,rgba(0,0,0,.06) 0 3deg,transparent 3deg 9deg);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ===== Úrovne ===== */
.lvls{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:640px){.lvls{grid-template-columns:repeat(3,1fr)}}
.lvl{display:flex;gap:14px;align-items:center;text-align:left;cursor:pointer;padding:14px;border-radius:18px;border:3px solid var(--ink);background:var(--paper);box-shadow:var(--sh);transition:transform .15s;color:var(--ink)}
@media(min-width:640px){.lvl{flex-direction:column;text-align:center}.lvl .av{width:140px;height:160px}}
.lvl:hover{transform:translate(-2px,-2px) rotate(-.6deg)}
.lvl.on{background:var(--c);transform:rotate(-1deg)}
.lvl .av{flex:none;width:96px;height:112px;border-radius:16px;overflow:hidden;border:3px solid var(--ink);background:#fff}
.lvl h3{font-size:1.6rem}.lvl p{margin:2px 0 0;font-size:.86rem}
/* ===== Mapa – komiksové epizódy ===== */
.prog{height:16px;border-radius:99px;background:#fff;overflow:hidden;margin:6px 0 2px;border:3px solid var(--ink)}
.prog i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--a1) 0 10px,var(--a2) 10px 20px);transition:width .6s}
.eps{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:640px){.eps{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.eps{grid-template-columns:1fr 1fr 1fr}}
.ep{position:relative;display:flex;flex-direction:column;text-align:left;padding:0;border-radius:16px;border:3px solid var(--ink);background:var(--paper);box-shadow:var(--sh);cursor:pointer;overflow:hidden;transition:transform .15s;color:var(--ink)}
.ep:nth-child(odd){transform:rotate(-.5deg)}.ep:nth-child(even){transform:rotate(.5deg)}
.ep:hover{transform:translate(-2px,-3px) rotate(0)}
.ep .sc{height:130px;border-bottom:3px solid var(--ink);overflow:hidden;position:relative}
.ep .sc svg{width:100%;height:100%;display:block}
.ep .bust{position:absolute;right:-6px;bottom:-4px;width:118px;height:136px;filter:drop-shadow(3px 0 0 #141414)}
.ep .bust svg{width:100%;height:100%}
.ep .no{position:absolute;left:8px;top:8px;font-family:'Bangers';font-size:1.3rem;background:var(--a1);border:3px solid var(--ink);border-radius:10px;padding:0 8px;box-shadow:2px 2px 0 var(--ink)}
.ep .tx{padding:10px 14px 14px}
.ep .yrs{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.1em;font-weight:700;color:var(--mut)}
.ep h3{font-size:1.55rem;margin:2px 0}
.ep p{margin:0;font-size:.86rem}
.stamp{position:absolute;right:10px;top:10px;font-family:'Bangers';font-size:1.1rem;letter-spacing:.08em;color:var(--ok);background:#fff;border:3px solid var(--ok);border-radius:10px;padding:2px 8px;transform:rotate(8deg)}
.ep.exam{background:var(--red);color:#fff}
/* ===== Úvodná komiksová strana ===== */
.intro{position:fixed;inset:0;z-index:60;background:var(--page);display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
.intro:before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.1) 1.6px,transparent 1.8px) 0 0/12px 12px}
.page{position:relative;width:min(760px,100%);display:grid;gap:12px;grid-template-columns:1fr 1fr}
.panel{position:relative;border:4px solid var(--ink);background:var(--paper);border-radius:6px;overflow:hidden;box-shadow:6px 6px 0 #000;opacity:0}
.panel.p1{grid-column:1/-1;height:min(38vh,280px)}
.panel.p1 svg{width:100%;height:100%;display:block}
.panel .hero-bust{position:absolute;right:-4px;bottom:-6px;height:96%;aspect-ratio:156/186;filter:drop-shadow(4px 0 0 #141414)}
.panel .hero-bust svg{width:100%;height:100%}
.panel .capbox{position:absolute;left:10px;top:10px;max-width:60%;background:var(--yel);border:3px solid var(--ink);padding:6px 10px;font-weight:700;font-size:clamp(.9rem,2.8vw,1.1rem)}
.panel.p2{display:flex;gap:10px;align-items:center;padding:12px;min-height:150px}
.panel.p2 .av{flex:none;width:104px;height:120px;border:3px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff}
.panel.p2 .bub{flex:1;font-size:clamp(.92rem,2.8vw,1.08rem)}
.panel.p3{display:grid;place-items:center;padding:14px;background:var(--a1);min-height:150px;text-align:center}
.panel.p3 .bshape{position:absolute;inset:6% 4%;background:var(--yel);clip-path:polygon(50% 0,61% 20%,86% 6%,80% 32%,100% 42%,82% 56%,96% 84%,68% 76%,56% 100%,44% 78%,16% 94%,22% 64%,0 56%,20% 40%,8% 10%,36% 22%)}
.panel.p3 .btxt{position:relative;font-family:'Bangers';font-size:clamp(1.15rem,4.2vw,1.7rem);line-height:1.05;letter-spacing:.04em;max-width:72%;text-align:center}
.panel.p3 .bg{position:absolute;inset:-40%;background:repeating-conic-gradient(rgba(0,0,0,.12) 0 4deg,transparent 4deg 12deg);animation:spin 30s linear infinite}
.slam{animation:slam .55s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes slam{0%{opacity:0;transform:scale(1.6) rotate(-6deg)}100%{opacity:1;transform:none}}
.slideL{animation:slideL .6s cubic-bezier(.2,1.2,.4,1) forwards}
@keyframes slideL{0%{opacity:0;transform:translateX(-60px) rotate(-3deg)}100%{opacity:1;transform:none}}
.slideR{animation:slideR .6s cubic-bezier(.2,1.2,.4,1) forwards}
@keyframes slideR{0%{opacity:0;transform:translateX(60px) rotate(3deg)}100%{opacity:1;transform:none}}
.pageft{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;opacity:0}
.pageft .what{color:#fff;max-width:48ch;font-size:.95rem}
.fadein{animation:fadein .5s forwards}
@keyframes fadein{to{opacity:1}}
.intro .skip{position:fixed;top:12px;right:12px;z-index:2}
@media(max-width:520px){.page{grid-template-columns:1fr}.panel.p1{height:230px}.panel .capbox{max-width:62%}}
/* ===== Kapitola ===== */
.chhead{display:flex;align-items:center;gap:12px;margin:4px 0 14px;color:#fff}
.chhead h2{color:#fff;text-shadow:3px 3px 0 var(--ink);-webkit-text-stroke:1px var(--ink)}
.chhead .tt{flex:1;min-width:0}
.chhead .eyebrow{color:var(--a1)}
.ring{flex:none;width:56px;height:56px}
.guide{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.guide .av{flex:none;width:88px;height:100px;border-radius:14px;overflow:hidden;border:3px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink)}
.guide .bub{flex:1;font-size:1rem}
.guide .nm{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.14em;color:var(--mut);margin-bottom:4px}
.typing:after{content:"▍";animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.pills{display:flex;gap:8px;overflow-x:auto;padding:4px 6px 12px 2px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;min-height:44px;padding:8px 14px;border-radius:12px;border:3px solid var(--ink);background:#fff;cursor:pointer;font-size:.86rem;font-weight:700;white-space:nowrap;box-shadow:3px 3px 0 var(--ink)}
.pill.on{background:var(--a1)}
.pill.ok:before{content:"✔ ";color:var(--ok)}
.task h3{font-size:1.7rem;margin-bottom:6px}
.task .ins{margin:0 0 14px}
.fb{min-height:1.5em;margin-top:12px;font-weight:700}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pop{animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
details.hint{margin-top:12px;border:2px dashed var(--ink);border-radius:12px;padding:8px 12px;font-size:.92rem;background:#fff}
details.hint summary{cursor:pointer;font-weight:700;min-height:28px}
.next{margin-top:16px;padding:14px;border-radius:14px;background:#d3f9d8;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.fx{position:fixed;z-index:80;pointer-events:none;left:50%;top:40%;transform:translate(-50%,-50%);animation:fx 1s forwards}
@keyframes fx{0%{transform:translate(-50%,-50%) scale(.2) rotate(-20deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15) rotate(4deg);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:0}}
/* slovník */
.gl{border-bottom:3px dotted var(--red);cursor:help}
.gl:hover{background:var(--yel)}
.sheet-bg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.25s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;max-height:80vh;overflow:auto;background:var(--paper);border-top:4px solid var(--ink);border-radius:22px 22px 0 0;padding:16px 18px 28px;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:760px;margin:0 auto;color:var(--ink)}
.sheet.on{transform:none}
.sheet:not(.on){visibility:hidden;transition:transform .3s,visibility 0s .3s}
.sheet .grab{width:48px;height:6px;border-radius:5px;background:var(--ink);margin:0 auto 12px}
.sheet h3{font-size:1.8rem;margin-bottom:6px}
.terms input{width:100%;min-height:46px;border-radius:12px;border:3px solid var(--ink);background:#fff;padding:8px 12px;font:inherit;margin-bottom:10px}
.term{padding:10px 0;border-bottom:2px solid rgba(0,0,0,.12)}
/* ===== Triedič ===== */
.scard{position:relative;border-radius:16px;padding:20px 18px;background:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);min-height:120px}
.scard .stext{font-size:1.15rem;font-weight:600;margin-top:6px}
.scard.ok{background:#d3f9d8}
.scard.bad{background:#ffe3e3}
.why{margin-top:12px;padding-top:12px;border-top:2px dashed var(--ink);font-size:.97rem}
.bins{display:grid;gap:10px;margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.bin{min-height:54px;padding:10px;border-radius:14px;border:3px solid var(--ink);background:var(--paper2);cursor:pointer;font-weight:700;font-size:.92rem;box-shadow:3px 3px 0 var(--ink);transition:transform .1s}
.bin:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.bin.right{background:#8ce99a}
.bin.wrong{background:#ffa8a8}
.bin:disabled{cursor:default}
/* poradie */
.olist{display:flex;flex-direction:column;gap:8px}
.orow{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-radius:12px;border:3px solid var(--ink);background:#fff;cursor:pointer;transition:transform .15s}
.orow.sel{background:var(--yel);transform:rotate(-1deg)}
.orow.ok{background:#d3f9d8}.orow.bad{background:#ffe3e3}
.orow .n{flex:none;width:28px;font-family:'Bangers';font-size:1.3rem}
.orow .t{flex:1;font-size:.95rem}
.orow .d{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--ok);display:block;font-weight:700}
.orow .ar{flex:none;display:flex;flex-direction:column;gap:3px}
.orow .ar button{width:42px;height:30px;border-radius:8px;border:2px solid var(--ink);background:var(--paper2);cursor:pointer;font-size:.8rem}
/* voľby / dvojice */
.opts{display:grid;gap:8px}
.opt{text-align:left;min-height:50px;padding:10px 14px;border-radius:12px;border:3px solid var(--ink);background:#fff;cursor:pointer;font-size:.97rem;box-shadow:3px 3px 0 var(--ink);transition:transform .1s}
.opt:hover:not(:disabled){background:var(--paper2)}
.opt.right{background:#8ce99a}
.opt.wrong{background:#ffa8a8}
.opt:disabled{cursor:default}
.pq{padding:14px;border-radius:14px;background:var(--a1);border:3px solid var(--ink);margin-bottom:12px;font-weight:700;font-size:1.05rem;box-shadow:3px 3px 0 var(--ink)}
.done-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.done-list div{font-size:.86rem;padding:8px 12px;border-radius:10px;background:#d3f9d8;border:2px solid var(--ink)}
/* prejav */
.speaker{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.speaker .pic{flex:none;width:96px;height:110px;border-radius:14px;overflow:hidden;box-shadow:3px 3px 0 #141414;display:grid;place-items:center;font-family:'Bangers';font-size:1.5rem;border:3px solid var(--ink)}
.speech{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.3rem;line-height:1.55;padding:16px;border-radius:14px;background:#fff;border:3px solid var(--ink)}
.speech .s{cursor:pointer;border-radius:6px;padding:1px 2px;transition:background .2s}
.speech .s:hover{background:rgba(0,0,0,.07)}
.speech .s.found{background:var(--yel)}
.speech .s.no{background:#ffd1d1}

<script>
'use strict';
/* ===== Pomocníci ===== */
const $=(s,r=document)=>r.querySelector(s);
function el(tag,a,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(a||{})){if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k==='style')e.style.cssText=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;}
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().trim();
function plural(n,a,b,c){return n===1?a:(n>=2&&n<=4?b:c);}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* [[pojem]] alebo [[pojem|tvar]] → klikateľný pojem, **x** → tučné */
function rich(t){return String(t).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,k,f)=>`<span class="gl" role="button" tabindex="0" data-k="${esc(k)}">${f||k}</span>`).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');}
const strip=t=>String(t).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,k,f)=>f||k).replace(/\*\*/g,'').replace(/<[^>]+>/g,'');

/* ===== Ukladanie ===== */
const KEY='lekcie-demokracie-v1';
const S=(()=>{let d={level:null,sound:true,prog:{},quiz:{},name:''};try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&typeof r==='object')d=Object.assign(d,r);}catch(e){}return d;})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const LV=()=>S.level||'kronikar';
function prog(ch){const l=LV();S.prog[l]=S.prog[l]||{};S.prog[l][ch]=S.prog[l][ch]||[];return S.prog[l][ch];}
function chDone(ch){return !!(S.quiz[LV()]&&S.quiz[LV()][ch]);}

/* ===== Zvuk a čítanie ===== */
let AC=null;
function beep(ok){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'triangle':'sawtooth';o.frequency.setValueAtTime(ok?620:200,t);o.frequency.exponentialRampToValueAtTime(ok?1040:140,t+.16);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(ok?.14:.08,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.26);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.28);}catch(e){}}
function say(text){try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(strip(text));u.lang='sk-SK';const v=speechSynthesis.getVoices().find(v=>/^sk/i.test(v.lang));if(v)u.voice=v;u.rate=1;speechSynthesis.speak(u);}catch(e){}}
function hush(){try{speechSynthesis.cancel();}catch(e){}}

/* ===== Ikony ===== */
function ic(n,c='currentColor'){const P={
book:`<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z" fill="none" stroke="${c}" stroke-width="2"/><path d="M4 21V5M8 7h7" stroke="${c}" stroke-width="2"/>`,
on:`<path d="M4 9h4l5-4v14l-5-4H4z" fill="${c}"/><path d="M16 8a5 5 0 0 1 0 8M18.5 5.5a8.5 8.5 0 0 1 0 13" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"/>`,
off:`<path d="M4 9h4l5-4v14l-5-4H4z" fill="${c}"/><path d="m16 9 6 6m0-6-6 6" stroke="${c}" stroke-width="2" stroke-linecap="round"/>`,
fire:`<path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-4-1-6 1-9z" fill="${c}"/>`,
temple:`<path d="M3 9 12 3l9 6z" fill="${c}"/><g fill="${c}"><rect x="5" y="10" width="2.4" height="8"/><rect x="10.8" y="10" width="2.4" height="8"/><rect x="16.6" y="10" width="2.4" height="8"/><rect x="3" y="19" width="18" height="2"/></g>`,
eagle:`<path d="M12 4c2 0 3 1.5 3 3l6-2-3 5 3 1-6 2v5l-3 3-3-3v-5l-6-2 3-1-3-5 6 2c0-1.5 1-3 3-3z" fill="${c}"/>`,
scroll:`<path d="M6 3h11a3 3 0 0 1 0 6h-1v10a2 2 0 0 1-2 2H5a2 2 0 0 1 0-4h1z" fill="none" stroke="${c}" stroke-width="2"/><path d="M9 9h4M9 13h4" stroke="${c}" stroke-width="2"/>`,
storm:`<path d="M6 14a4 4 0 0 1 1-8 6 6 0 0 1 11 2 3 3 0 0 1 0 6z" fill="${c}"/><path d="m11 15-2 4h3l-2 4" fill="none" stroke="${c}" stroke-width="2"/>`,
gears:`<circle cx="9" cy="9" r="3" fill="none" stroke="${c}" stroke-width="2"/><path d="M9 3v2M9 13v2M3 9h2M13 9h2" stroke="${c}" stroke-width="2"/><circle cx="16" cy="16" r="3" fill="none" stroke="${c}" stroke-width="2"/><path d="M16 11v2M16 19v2M11 16h2M19 16h2" stroke="${c}" stroke-width="2"/>`,
mask:`<path d="M3 6c3 1 6 1 9 0s6-1 9 0c0 7-4 12-9 12S3 13 3 6z" fill="${c}"/><circle cx="8.5" cy="10" r="1.6" fill="#0b0d14"/><circle cx="15.5" cy="10" r="1.6" fill="#0b0d14"/><path d="M9 14q3 2 6 0" stroke="#0b0d14" stroke-width="1.6" fill="none"/>`,
radar:`<circle cx="12" cy="12" r="9" fill="none" stroke="${c}" stroke-width="2"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="${c}" stroke-width="2"/><path d="M12 12 19 6" stroke="${c}" stroke-width="2.4" stroke-linecap="round"/>`,
exam:`<path d="M12 2 4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6z" fill="none" stroke="${c}" stroke-width="2"/><path d="m8.5 12 2.5 2.5 4.5-5" fill="none" stroke="${c}" stroke-width="2.2"/>`,
back:`<path d="M15 5 8 12l7 7" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round"/>`,
speak:`<path d="M4 9h4l5-4v14l-5-4H4z" fill="${c}"/><path d="M16 9a4 4 0 0 1 0 6" fill="none" stroke="${c}" stroke-width="2"/>`
};return `<svg viewBox="0 0 24 24" aria-hidden="true">${P[n]||''}</svg>`;}

/* ===== Spodný panel (slovník a pod.) ===== */
function openSheet(node){const sh=$('#sheet');sh.innerHTML='';sh.append(el('div',{class:'grab'}),node,el('div',{style:'margin-top:16px'},el('button',{class:'btn ghost sm',onclick:closeSheet},'Zavrieť')));sh.classList.add('on');$('#sbg').classList.add('on');sh.scrollTop=0;}
function closeSheet(){$('#sheet').classList.remove('on');$('#sbg').classList.remove('on');}
function openTerm(k){const d=GLOS[k]||GLOS[Object.keys(GLOS).find(x=>norm(x)===norm(k))];openSheet(el('div',{},el('div',{class:'eyebrow'},'Slovník pojmov'),el('h3',{},k),el('p',{html:rich(d||'Pojem sa pripravuje.')})));}
function openDict(){const list=el('div',{});const inp=el('input',{type:'search',placeholder:'Hľadaj pojem…','aria-label':'Hľadaj pojem'});
 function draw(){const q=norm(inp.value);list.innerHTML='';Object.keys(GLOS).sort((a,b)=>a.localeCompare(b,'sk')).filter(k=>!q||norm(k).includes(q)||norm(GLOS[k]).includes(q)).forEach(k=>list.append(el('div',{class:'term',html:`<b>${esc(k)}</b> – ${rich(GLOS[k])}`})));}
 inp.addEventListener('input',draw);draw();openSheet(el('div',{class:'terms'},el('div',{class:'eyebrow'},`Slovník · ${Object.keys(GLOS).length} pojmov`),el('h3',{},'Pojmy demokracie'),inp,list));}
document.addEventListener('click',e=>{const g=e.target.closest('.gl');if(g){e.preventDefault();openTerm(g.dataset.k);}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('gl'))openTerm(e.target.dataset.k);if(e.key==='Escape')closeSheet();});

/* ===== Spätná väzba ===== */
function fb(node,ok,msg){node.className='fb '+(ok?'ok':'bad');node.innerHTML=(ok?'✔ ':'✘ ')+rich(msg);if(!ok){node.classList.remove('shake');void node.offsetWidth;node.classList.add('shake');}}
function shakeIt(n){n.classList.remove('shake');void n.offsetWidth;n.classList.add('shake');}

/* ================= SPOLOČNÉ MECHANIKY ================= */

/* Triedič kartičiek – vysvetlenie ostáva v kartičke, nič sa neposúva samo */
function sorter(box,o,ok){
 const bins=o.bins;const lv=LV();
 let pool=o.items.filter(x=>!(lv==='putnik'&&x.p===false));
 const n=Math.min(o.n||pool.length,pool.length);
 let items,i,good,res;
 const wrap=el('div',{});box.append(wrap);
 function start(){items=shuffle(pool).slice(0,n);i=0;good=0;res=[];show();}
 function show(){
  wrap.innerHTML='';
  if(i>=items.length)return finish();
  const it=items[i];
  const card=el('div',{class:'scard pop'},el('div',{class:'mono tiny mut'},`KARTIČKA ${i+1} / ${items.length}`),el('div',{class:'stext',html:rich(it.t)}));
  const row=el('div',{class:'bins'});
  bins.forEach(b=>row.append(el('button',{class:'bin','data-b':b.id,onclick:()=>answer(b.id)},b.label)));
  wrap.append(card,row);
  function answer(bid){
   const right=bid===it.b;if(right)good++;res.push({it,right});beep(right);
   row.querySelectorAll('.bin').forEach(x=>{x.disabled=true;if(x.dataset.b===it.b)x.classList.add('right');else if(x.dataset.b===bid)x.classList.add('wrong');});
   card.classList.add(right?'ok':'bad');if(!right)shakeIt(card);
   const lab=bins.find(b=>b.id===it.b).label;
   card.append(el('div',{class:'why',html:(right?'<b style="color:var(--ok)">✔ Správne.</b> ':`<b style="color:var(--bad)">✘ Patrí to do: ${esc(lab)}.</b> `)+rich(it.why||'')}),
    el('div',{style:'margin-top:12px'},el('button',{class:'btn sm',onclick:()=>{i++;show();}},i+1<items.length?(right?'Ďalšia kartička →':'Rozumiem, ďalšia →'):'Vyhodnotiť →')));
   card.scrollIntoView({block:'nearest',behavior:'smooth'});
  }
 }
 function finish(){
  const need=window.__PASS0?0:Math.ceil((o.pass||.7)*items.length);
  const passed=good>=need;

  if(passed){fb(f,true,o.okMsg||'Výborne, triedenie zvládnuté.');if(o.after)o.after(wrap,res,ok);else ok();}

/* Zoraďovanie – ťukni na dva riadky (vymenia sa) alebo použi šípky */
function order(box,o,ok){
 const n=Math.min(o.n||o.items.length,o.items.length);
 const chosen=shuffle(o.items).slice(0,n);
 const right=[...chosen].sort((a,b)=>a.k-b.k);
 let cur;do{cur=shuffle(chosen);}while(cur.every((x,i)=>x===right[i])&&n>1);
 let sel=-1,tries=0,doneFlag=false;
 const list=el('div',{class:'olist'});const f=el('div',{class:'fb'});const ctr=el('div',{class:'row',style:'margin-top:12px'});
 box.append(el('div',{class:'mono tiny mut',style:'margin-bottom:8px'},o.top||'▲ NAJSKÔR'),list,el('div',{class:'mono tiny mut',style:'margin-top:8px'},o.bottom||'▼ NAJNESKÔR'),ctr,f);
 function draw(marks){
  list.innerHTML='';
  cur.forEach((it,i)=>{
   const r=el('div',{class:'orow'+(sel===i?' sel':'')+(marks?(marks[i]?' ok':' bad'):''),onclick:()=>tap(i)},
    el('span',{class:'n'},i+1),
    el('span',{class:'t',html:rich(it.t)+(doneFlag&&it.d?`<span class="d">${esc(it.d)}</span>`:'')}),
    el('span',{class:'ar'},el('button',{'aria-label':'Posunúť vyššie',onclick:e=>{e.stopPropagation();mv(i,-1);}},'▲'),el('button',{'aria-label':'Posunúť nižšie',onclick:e=>{e.stopPropagation();mv(i,1);}},'▼')));
   list.append(r);
  });
 }
 function tap(i){if(doneFlag)return;if(sel<0){sel=i;}else if(sel===i){sel=-1;}else{[cur[sel],cur[i]]=[cur[i],cur[sel]];sel=-1;}draw();}
 function mv(i,d){if(doneFlag)return;const j=i+d;if(j<0||j>=cur.length)return;[cur[i],cur[j]]=[cur[j],cur[i]];sel=-1;draw();}
 const chk=el('button',{class:'btn',onclick:check},'Skontrolovať poradie');ctr.append(chk);
 function check(){
  const marks=cur.map((x,i)=>x===right[i]);const k=marks.filter(Boolean).length;
  if(k===cur.length){doneFlag=true;beep(true);draw(marks);fb(f,true,o.okMsg||'Poradie sedí!');chk.remove();if(o.after)o.after(box);ok();return;}
  tries++;beep(false);draw(marks);
  fb(f,false,`Na správnom mieste: ${k} z ${cur.length}. `+(o.hint&&tries===1?o.hint:'Zelené nechaj, červené presuň.'));
  if(tries>=3&&!ctr.querySelector('.ghost'))ctr.append(el('button',{class:'btn ghost',onclick:()=>{cur=[...right];doneFlag=true;draw(cur.map(()=>true));fb(f,true,'Takto je to správne. Pozri si roky – pomôžu ti zapamätať si to.');chk.remove();ctr.querySelector('.ghost').remove();if(o.after)o.after(box);ok();}},'Ukáž riešenie'));
 }
 draw();
}

/* Dvojice – postupne: ku každej položke vyber správny protiklad */
function pairs(box,o,ok){
 const n=Math.min(o.n||o.pairs.length,o.pairs.length);
 const ps=shuffle(o.pairs).slice(0,n).map((p,i)=>({a:p[0],b:p[1],why:p[2],i}));
 let k=0,errs=0;const doneL=el('div',{class:'done-list'});const stage=el('div',{});const f=el('div',{class:'fb'});
 box.append(doneL,stage,f);
 function show(){
  stage.innerHTML='';
  if(k>=ps.length){fb(f,true,o.okMsg||'Všetky dvojice sedia!');beep(true);return ok();}

  const left=ps.slice(k);
  stage.append(el('div',{class:'mono tiny mut',style:'margin-bottom:6px'},`${k+1} / ${ps.length} · ${o.lq||'PRIRAĎ'}`),el('div',{class:'pq',html:rich(cur.a)}));
  const opts=el('div',{class:'opts'});
  shuffle(left).forEach(p=>opts.append(el('button',{class:'opt','data-i':p.i,html:rich(p.b),onclick:ev=>{
   if(p===cur){ev.currentTarget.classList.add('right');beep(true);opts.querySelectorAll('.opt').forEach(x=>x.disabled=true);
    doneL.append(el('div',{html:`<b>${rich(cur.a)}</b> → ${rich(cur.b)}`}));
    if(cur.why){stage.append(el('div',{class:'why',html:'✔ '+rich(cur.why)}),el('button',{class:'btn sm',style:'margin-top:10px',onclick:()=>{k++;show();}},'Ďalej →'));fb(f,true,'Správne.');}
    else{fb(f,true,'Správne.');setTimeout(()=>{k++;show();},650);}
   }else{errs++;ev.currentTarget.classList.add('wrong');ev.currentTarget.disabled=true;beep(false);fb(f,false,errs>=2?'Správna možnosť je zvýraznená.':'Nie, skús inú možnosť.');
    if(errs>=2)opts.querySelectorAll('.opt').forEach(x=>{if(+x.dataset.i===cur.i)x.classList.add('right');});}
  }})));
  stage.append(opts);
 }
 show();
}

function mc(box,q,done,once){

 wrap.append(el('div',{class:'pq',html:rich(q.q)}));
 const opts=el('div',{class:'opts'});const f=el('div',{class:'fb'});
 const list=shuffle(q.o.map((t,i)=>({t,ok:i===0})));
 let tries=0;
 list.forEach(o=>opts.append(el('button',{class:'opt','data-ok':o.ok?'1':'0',html:rich(o.t),onclick:ev=>{
  tries++;
  if(o.ok){ev.currentTarget.classList.add('right');opts.querySelectorAll('.opt').forEach(x=>x.disabled=true);beep(true);fb(f,true,q.w||'Správne.');done&&done(tries===1);}
  else{ev.currentTarget.classList.add('wrong');beep(false);
   if(once){opts.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.ok==='1')x.classList.add('right');});fb(f,false,'Správne je zvýraznené. '+(q.w||''));done&&done(false);}
   else{ev.currentTarget.disabled=true;fb(f,false,tries>=2?'Ešte raz – vylúč nesprávne možnosti. '+(q.h||''):(q.h||'Nie celkom. Skús znova.'));}}
 }})));
 wrap.append(opts,f);
 return wrap;

'Platón':'Aténsky filozof (asi 427 – 347 pred Kr.), žiak Sokrata. V diele Ústava (Politeia) navrhol, aby štát riadili filozofi. Demokraciu kritizoval, okrem iného preto, že aténsky súd odsúdil Sokrata na smrť.',
'Aristoteles':'Grécky filozof (384 – 322 pred Kr.), žiak Platóna. Rozdelil vlády na dobré (monarchia, aristokracia, politeia) a zvrhnuté (tyrania, oligarchia, demokracia v zmysle vlády chudobných vo vlastný prospech).',
'filozof-vládca':'Platónov ideál: štát má viesť ten, kto pozná pravdu a dobro, tak ako loď má viesť skúsený kormidelník.',
'tyrania':'Vláda jedného človeka vo vlastný prospech, bez ohľadu na zákony.',
'oligarchia':'Vláda malej skupiny – najčastejšie bohatých – vo vlastný prospech.',
'politeia':'U Aristotela dobrá vláda mnohých podľa zákonov a v prospech všetkých; zmes demokracie a oligarchie.',

'konzul':'Najvyšší úradník rímskej republiky. Volili sa dvaja naraz na jeden rok a každý mohol vetovať druhého.',
'tribún ľudu':'Rímsky úradník volený plebejcami (obyčajnými občanmi). Mohol vetovať rozhodnutia úradníkov aj senátu, ktoré by im škodili.',

'senát':'V Ríme rada bývalých úradníkov s veľkou autoritou. Dnes horná komora parlamentu v mnohých krajinách.',
'diktátor':'V rímskej republike mimoriadny úradník s veľkou mocou na čas krízy, najviac na 6 mesiacov. Dnes vládca s neobmedzenou mocou, ktorý sa nezodpovedá voličom ani súdom.',
'fasáda':'Prednú stenu domu vidno, ale nehovorí nič o tom, čo je vnútri. V politike: inštitúcie (voľby, parlament) navonok existujú, ale skutočne rozhoduje niekto iný.',

'zákonovravca':'Na Islande lögsögumaður – volený muž, ktorý poznal zákony naspamäť a prednášal ich zo Skaly zákona (Lögberg). Zákony sa spísali až v rokoch 1117 – 1118.',
'Magna Charta':'Veľká listina slobôd, ktorú si v roku 1215 na anglickom kráľovi Jánovi vynútili baróni. Okrem iného: slobodného človeka nemožno potrestať bez zákonného súdu.',
'Zlatá bula':'Listina uhorského kráľa Ondreja II. z roku 1222. Chránila práva šľachty a dovoľovala jej odporovať kráľovi, ktorý by ich porušil (právo odporu). Týkala sa aj územia dnešného Slovenska.',
'Niccolò Machiavelli':'Florentský úradník a mysliteľ (1469 – 1527). V knihe Vladár (napísaná 1513, vydaná 1532) opísal, ako získať a udržať moc – bez ohľadu na morálku.',
'makiavelizmus':'Politika, pri ktorej sa na dosiahnutie moci používa klamstvo, manipulácia a bezohľadnosť. Podľa Machiavelliho, hoci on sám bol zložitejší mysliteľ.',
'Leviatan':'Dielo Thomasa Hobbesa (1651). Tvrdí, že bez silného panovníka by bol život „vojnou všetkých proti všetkým“, a preto sa ľudia majú podriadiť absolútnej moci.',
'spoločenská zmluva':'Myšlienka, že štát vzniká dohodou ľudí. U Hobbesa sa ľudia vzdajú slobody za bezpečie, u Locka zverujú vláde ochranu svojich práv a môžu ju vymeniť, ak zlyhá, u Rousseaua vyjadruje všeobecnú vôľu ľudu.',
'prirodzené práva':'Práva, ktoré má človek od narodenia, nie z milosti panovníka: podľa Johna Locka život, sloboda a majetok.',

'dystopia':'Opak utópie: varovný obraz spoločnosti, v ktorej sa sen o dokonalosti zmenil na útlak. Napr. 1984 (George Orwell) alebo Prekrásny nový svet (Aldous Huxley).',
'toryovia':'Anglická strana od konca 17. storočia: za silného kráľa, anglikánsku cirkev a vidiecku šľachtu. Meno bola pôvodne nadávka (írsky psanec). Dnešní britskí konzervatívci sa dodnes prezývajú tories.',
'whigovia':'Anglická strana od konca 17. storočia: za moc parlamentu, náboženskú toleranciu protestantov a obchod. Meno bola pôvodne nadávka pre škótskych vzbúrencov. Z whigov sa neskôr vyvinuli liberáli.',
'Slávna revolúcia':'Nekrvavá zmena panovníka v Anglicku v rokoch 1688 – 1689. Parlament povolal Viliama Oranžského a Máriu, ktorí prijali Zákon o právach (Bill of Rights) – kráľ odvtedy vládne s parlamentom.',
'lojálna opozícia':'Strany, ktoré kritizujú vládu a chcú ju vystriedať, ale rešpektujú pravidlá a štát. Opozícia nie je zradca – je to vláda v zálohe.',

'ľudová suverenita':'Zdrojom moci v štáte je ľud, nie panovník ani Boh. Napr. Ústava SR: „Štátna moc pochádza od občanov“ (čl. 2).',
'ľavica':'Pojem z roku 1789, keď vo francúzskom zhromaždení sedeli vľavo zástancovia zmien a rovnosti. Dnes zjednodušene: dôraz na rovnosť, sociálny štát a reguláciu trhu.',
'pravica':'Pojem z roku 1789, keď vo francúzskom zhromaždení sedeli vpravo zástancovia kráľa a tradície. Dnes zjednodušene: dôraz na tradíciu, osobnú zodpovednosť a voľný trh. Obsah pojmov sa v čase a v rôznych krajinách mení.',
'liberalizmus':'Ideológia, ktorá zdôrazňuje slobodu jednotlivca, ústavu, práva, slobodu prejavu a podnikania a obmedzenie moci štátu.',
'konzervativizmus':'Ideológia, ktorá zdôrazňuje tradíciu, osvedčené inštitúcie a postupné, opatrné zmeny namiesto revolúcií.',
'socializmus':'Ideológia, ktorá zdôrazňuje rovnosť, spravodlivé rozdelenie bohatstva a práva pracujúcich. Demokratickí socialisti a sociálni demokrati presadzujú zmeny voľbami; revoluční komunisti násilím.',
'nacionalizmus':'Ideológia, podľa ktorej je národ najdôležitejším spoločenstvom. Môže byť umiernený (práva národa na jazyk a štát), ale aj agresívny – vtedy popiera práva iných národov a menšín.',
'anarchizmus':'Ideológia, ktorá chce zrušiť štát a nahradiť ho dobrovoľnou spoluprácou ľudí.',
'Žiadosti slovenského národa':'Program slovenských vlastencov prijatý 10. – 11. mája 1848 v Liptovskom Mikuláši. Žiadal okrem iného slovenčinu v školách a úradoch, vlastný snem a všeobecné volebné právo.',
'všeobecné volebné právo':'Právo voliť majú všetci dospelí občania bez ohľadu na majetok, vzdelanie, pohlavie či pôvod. V Československu od roku 1918/1920 aj pre ženy.',
'sufražetky':'Bojovníčky za volebné právo žien na prelome 19. a 20. storočia, najmä v Británii.',

'autoritatívny režim':'Diktatúra, v ktorej vládne vodca, strana alebo armáda bez slobodných volieb a skutočnej opozície; na rozdiel od totality nemusí ovládať celý súkromný život.',
'hybridný režim':'Režim na pomedzí: voľby sa konajú, ale nie sú férové – vláda ovláda médiá, prenasleduje opozíciu, podriaďuje si súdy. Politológovia ho volajú aj súťaživý autoritarizmus.',
'liberálna demokracia':'Demokracia, v ktorej sa nielen volí, ale sú chránené aj práva jednotlivcov a menšín, nezávislé súdy, slobodné médiá a deľba moci.',

'epistokracia':'Vláda „tých, čo vedia“ – napr. návrh, aby mali vzdelanejší ľudia viac hlasov alebo aby len oni smeli voliť.',
'anarchia':'Stav bez štátu a vlády. V bežnej reči aj chaos bez pravidiel.',
'fašizmus':'Hnutie a režim Benita Mussoliniho v Taliansku (pri moci od 1922). Kult národa a vodcu, jedna strana, násilie ako prostriedok, potlačenie slobôd. Pojmom sa označujú aj príbuzné hnutia.',

'komunizmus':'Ideológia, ktorá chce spoločnosť bez tried a súkromného vlastníctva. V praxi 20. storočia (ZSSR, Československo 1948 – 1989, Čína, Kambodža) viedla k diktatúram jednej strany s tajnou políciou a politickými väzňami.',

'Židovský kódex':'Nariadenie vlády Slovenského štátu č. 198/1941 z 9. septembra 1941. Na rasovom základe zbavil Židov takmer všetkých práv. V roku 1942 nasledovali deportácie asi 58 000 Židov.',
'holokaust':'Nacistická genocída približne 6 miliónov európskych Židov počas druhej svetovej vojny. Zo Slovenska zahynulo asi 70 000 Židov.',
'arizácia':'Zabavenie majetku Židov a jeho prevod na „árijcov“ – v Nemecku aj v Slovenskom štáte.',
'zmocňovací zákon':'Nemecký zákon z 23. marca 1933 (444 hlasov za, 94 proti). Hitlerova vláda smela vydávať zákony bez parlamentu – právny základ diktatúry.',

'Ľudové milície':'Ozbrojené jednotky Komunistickej strany Československa (1948 – 1989), ktoré vo februári 1948 zastrašovali odporcov.',
'propaganda':'Šírenie jednostranných alebo nepravdivých informácií s cieľom ovládnuť názory ľudí.',
'obetný baránok':'Skupina alebo človek, ktorému sa nespravodlivo pripíše vina za všetky problémy.',
'dehumanizácia':'Rozprávanie o ľuďoch ako o zvieratách, hmyze, špine či chorobe. Historicky predchádzala prenasledovaniu a genocídam.',
'konšpiračná teória':'Vysvetlenie udalostí tajným sprisahaním mocných skupín, ktoré sa nedá vyvrátiť, lebo každý protidôkaz sa vyhlási za súčasť sprisahania.',
'populizmus':'Politický štýl, ktorý delí spoločnosť na „čistý ľud“ a „skazené elity“ a tvrdí, že len jeho vodca pozná vôľu ľudu. Môže byť ľavicový aj pravicový.',
'extrémizmus':'Postoje a činy, ktoré odmietajú demokraciu, rovnosť ľudí v dôstojnosti a právach a pripúšťajú násilie. Môže byť pravicový, ľavicový aj náboženský.',
'radikalizmus':'Snaha o veľké, zásadné zmeny („od koreňa“). Ak sa presadzuje v rámci demokratických pravidiel a bez násilia, je legitímnou súčasťou demokracie.',

'kult osobnosti':'Oslavovanie vodcu ako neomylného, takmer nadprirodzeného človeka. Typické pre Hitlera, Stalina aj Gottwalda.'
};

/* ---------- 04 SNEM ---------- */
T.althing={n:'Zákonovravca',ins:'Na Althingu zákony nikto nemal napísané – poznal ich naspamäť zákonovravca. Zapamätaj si zákony. Potom ich zákonovravca odrecituje… ale jeden nenápadne prekrúti. Nájdi ho! (Zákony v hre sú vymyslené v štýle severských pravidiel.)',
run(box,ok){
 const L=[{a:'Kto zabije cudzieho koňa, zaplatí jeho cenu dvakrát.',b:'Kto zabije cudzieho koňa, zaplatí jeho cenu raz.'},
  {a:'Kto ukradne ovcu, vráti dve ovce.',b:'Kto ukradne ovcu, vráti jednu ovcu.'},
  {a:'Vyhnanec nesmie tri roky vkročiť na Island.',b:'Vyhnanec nesmie tri mesiace vkročiť na Island.'},
  {a:'Spor o pastviny rozhodne súd dvanástich susedov.',b:'Spor o pastviny rozhodne náčelník sám.'},
  {a:'Kto bez dôvodu nepríde na Althing, zaplatí pokutu.',b:'Kto bez dôvodu nepríde na Althing, nič sa nestane.'},
  {a:'Hosť má právo na tri noci pod strechou.',b:'Hosť má právo na jednu noc pod strechou.'},
  {a:'Zákonovravcu volia na tri roky.',b:'Zákonovravca zostáva vo funkcii doživotne.'},
  {a:'Rozsudok súdu sa vyhlási nahlas pri Skale zákona.',b:'Rozsudok súdu sa oznámi len náčelníkovi.'}];
 const rounds=nLv(2,3,3);let r=0,score=0;const stage=el('div',{});const f=el('div',{class:'fb'});box.append(stage,f);
 function round(){stage.innerHTML='';f.className='fb';f.textContent='';
  if(r>=rounds){const w=after2(stage,`Odhalil si ${score} z ${rounds}`);
   mcSeries(w,[{q:'Prečo je nebezpečné, keď zákony pozná len jeden človek?',o:['Môže ich nenápadne zmeniť vo svoj prospech a nikto to nezistí.','Lebo má zlú pamäť.','Nie je to nebezpečné.'],w:'Islanďania zákony napokon spísali v rokoch 1117 – 1118. Napísaný a verejný zákon sa dá skontrolovať – rovnako ako Chammurapiho stéla.'}],()=>{pow();ok();});return;}
  const set=shuffle(L).slice(0,4);const swap=rnd(0,3);
  const t=el('div',{class:'mono tiny',style:'margin-bottom:8px'},`KOLO ${r+1} / ${rounds} · ZAPAMÄTAJ SI`);const list=el('div',{class:'laws'},...set.map(x=>el('div',{class:'law pop'},'📜 '+x.a)));
  const bar=el('div',{class:'qtimer'},el('i',{style:'width:100%'}));const go=el('button',{class:'btn',style:'margin-top:10px',onclick:recite},'Zapamätal som si');
  stage.append(t,list,bar,go);const sec=nLv(25,18,14);let left=sec;const iv=setInterval(()=>{left-=.1;bar.firstChild.style.width=Math.max(0,left/sec*100)+'%';if(left<=0)recite();},100);
  function recite(){clearInterval(iv);if(stage.dataset.rec==r)return;stage.dataset.rec=r;stage.innerHTML='';
   stage.append(el('div',{class:'row',style:'align-items:center;margin-bottom:14px;flex-wrap:nowrap'},el('div',{style:'flex:none;width:96px;height:112px;border:3px solid #141414;border-radius:12px;overflow:hidden;box-shadow:3px 3px 0 #141414',html:cast('zakonovravca','#a5d8ff')}),el('div',{class:'bub l',style:'flex:1'},'„Počujte zákon!“ – Ťukni na ten, ktorý som nenápadne „trochu upravil“.')));
   const order=shuffle(set.map((x,i)=>({x,i})));const box2=el('div',{class:'laws'});
   order.forEach(({x,i})=>box2.append(el('button',{class:'law pop','data-s':i===swap?1:0,onclick:ev=>{box2.querySelectorAll('.law').forEach(b=>{b.disabled=true;if(b.dataset.s==='1')b.classList.add('right');});
    const good=i===swap;if(good){score++;}else ev.currentTarget.classList.add('wrong');beep(good);
    fb(f,good,good?'Odhalené! Pôvodne znel: „'+set[swap].a+'“':'Nie. Prekrútený bol zelený zákon – pôvodne znel: „'+set[swap].a+'“');
    stage.append(el('button',{class:'btn sm',style:'margin-top:10px',onclick:()=>{r++;round();}},'Ďalej →'));}},'🗣 '+(i===swap?x.b:x.a))));
   stage.append(box2);}
 }
 round();
}};

T.charta={n:'Listiny slobôd',ins:'Magna Charta (1215) a Zlatá bula (1222) prvýkrát spútali kráľa. Ale nie všetko v stredoveku bolo o slobode. Zaraď vety.',

 {t:'Žiadny slobodný človek nesmie byť uväznený ani zbavený majetku inak ako zákonným súdom.',b:'o',why:'Magna Charta, článok 39 – základ práva na spravodlivý proces.'},
 {t:'Mimoriadne dane smie kráľ vyberať len so súhlasom rady veľmožov.',b:'o',why:'Magna Charta, článok 12 – zárodok myšlienky „žiadne dane bez zastúpenia“.'},
 {t:'Ak kráľ poruší tieto práva, biskupi a šľachtici smú mu odporovať a nebude to velezrada.',b:'o',why:'Zlatá bula (1222) – takzvané právo odporu. Týkala sa aj územia dnešného Slovenska.'},
 {t:'Kráľ každý rok zvolá zhromaždenie, kde mu šľachta prednesie sťažnosti.',b:'o',why:'Zlatá bula určila výročné zhromaždenie v Stoličnom Belehrade na sviatok sv. Štefana.'},
 {t:'Kráľ vládne z Božej milosti a nikomu sa nezodpovedá.',b:'n',why:'Klasická stredoveká predstava – presný opak listín slobôd.'},
 {t:'Poddaný sedliak nesmie bez súhlasu pána opustiť pôdu.',b:'n',why:'Toto obmedzuje poddaných, nie kráľa. Listiny slobôd chránili hlavne šľachtu.'},
 {t:'Kráľ môže zabrať pozemky komukoľvek, kto ho nahnevá.',b:'n',why:'Svojvôľa – presne proti tomu sa baróni vzbúrili.'},

T.machiavelli={n:'Poraď vladárovi',ins:'Si poradca renesančného vladára. Pri každej situácii tipni, čo by poradil Machiavelli. Potom uvidíš, čo na to demokracia.',
run(box,ok){
 const S=[{s:'Je pre vladára lepšie, aby ho ľudia milovali, alebo aby sa ho báli?',o:['Ak nemôže mať oboje, nech sa ho boja – ale nesmú ho nenávidieť.','Musí byť milovaný, inak ho zvrhnú.','Je to jedno.'],m:'Najlepšie je byť milovaný aj obávaný. Ak to nejde, je bezpečnejšie byť obávaný – láska je vrtkavá, strach z trestu drží. Nenávisť si však vladár privolať nesmie.',d:'V demokracii sa vládcu báť nemusíš: stačí, že ho môžeš vo voľbách odvolať.'},
  {s:'Vladár niečo sľúbil, ale dodržať sľub by mu teraz uškodilo.',o:['Nemusí ho dodržať – stačí, ak vyzerá čestne.','Sľub musí dodržať za každú cenu.','Musí odstúpiť.'],m:'Rozumný vladár nemusí dodržať slovo, ak sa obráti proti nemu. Má byť líškou, aby spoznal pasce, a levom, aby vyľakal vlkov.',d:'Slobodné médiá a voľby majú porušené sľuby odhaliť a potrestať. Preto ich autoritári tak radi obmedzujú.'},
  {s:'Vladár dobyl mesto a musí urobiť tvrdé opatrenia.',o:['Všetky tvrdé kroky naraz, dobrodenia rozdávať postupne.','Tvrdé kroky postupne, aby si ich nikto nevšimol.','Žiadne tvrdé kroky.'],m:'Krutosti treba vykonať naraz, aby sa na ne rýchlo zabudlo. Dobrodenia rozdávať po kúskoch, aby si ich ľudia dlho vychutnávali.',d:'Ústava a súdy zakazujú krutosti „naraz“ aj „postupne“. Moc má hranice bez ohľadu na taktiku.'},
  {s:'Je dôležitejšie byť dobrým človekom, alebo len tak vyzerať?',o:['Stačí vyzerať zbožne, verne a ľudsky – a vedieť v prípade potreby konať opačne.','Treba byť naozaj dobrý, inak to ľudia spoznajú.','Na tom nezáleží.'],m:'Ľudia súdia podľa toho, čo vidia, a len málokto vie, aký naozaj si. Vladár sa má javiť dobrým, ale vedieť konať aj zle.',d:'Preto posudzuj politika podľa činov a dôkazov, nie podľa imidžu, plagátov a videí.'},
  {s:'Napísal Machiavelli vetu „Účel svätí prostriedky“?',o:['Doslova nie – je to neskoršie zjednodušenie jeho myšlienok.','Áno, je to prvá veta knihy Vladár.','Áno, vytesal ju nad bránu Florencie.'],m:'Túto vetu v Machiavelliho dielach nenájdeš. Písal, že pri vladároch ľudia hľadia na výsledok. Z toho vzniklo zjednodušenie, ktoré sa mu pripisuje.',d:'Over si citát skôr, ako ho zdieľaš. Aj slávne „citáty“ bývajú vymyslené.'}];
 const set=LV()==='putnik'?[S[0],S[1],S[3]]:S;let i=0,score=0;const stage=el('div',{});box.append(stage);
 function nx(){stage.innerHTML='';if(i>=set.length){const w=after2(stage,`Myslel si ako Machiavelli v ${score} z ${set.length} prípadov`);
   mcSeries(w,[{q:'Prečo je dobré poznať Machiavelliho?',o:['Aby sme spoznali politikov, ktorí jeho rady používajú, a vedeli ich kontrolovať.','Aby sme ho napodobňovali v triede.','Lebo mal vždy pravdu.'],w:'Machiavelli opísal, ako moc naozaj funguje. Demokracia na to odpovedá kontrolou: voľbami, súdmi, médiami. Bezohľadnej politike hovoríme [[makiavelizmus]].'}],()=>{pow();ok();});return;}
  const s=set[i];stage.append(el('div',{class:'row',style:'align-items:center;flex-wrap:nowrap;margin-bottom:10px'},el('div',{style:'flex:none;width:86px;height:100px;border:3px solid #141414;border-radius:12px;overflow:hidden;box-shadow:3px 3px 0 #141414',html:cast('renesancia','#e5dbff')}),el('div',{class:'bub l',style:'flex:1;font-size:.95rem'},['Môj vladár sa pýta…','Poradca, potrebujem odpoveď.','Rýchlo, kým to nezistia ostatní.','Čo by si urobil na mojom mieste?','Počul som jeden citát…'][i%5])),el('div',{class:'mono tiny',style:'margin-bottom:6px'},`SITUÁCIA ${i+1} / ${set.length}`));
  mc(stage,{q:'🦊 '+s.s,o:s.o,w:'Tak by to videl aj Machiavelli.'},first=>{if(first)score++;
   stage.append(el('div',{class:'kingdoms pop',style:'margin-top:12px'},el('div',{class:'kg'},el('h3',{},'🦁 Machiavelli'),el('p',{class:'small'},s.m)),el('div',{class:'kg',style:'background:#e7f5ff'},el('h3',{},'🗳 Demokracia'),el('p',{class:'small'},s.d))),
    el('button',{class:'btn sm',style:'margin-top:12px',onclick:()=>{i++;nx();}},'Ďalšia situácia →'));},true);}
 nx();
}};

 {t:'Bez štátu by bol život osamelý, chudobný, odporný, surový a krátky.',b:'h',why:'Hobbes: v prirodzenom stave vládne vojna všetkých proti všetkým.'},
 {t:'Ľudia sa vzdajú svojej slobody v prospech panovníka, ktorý ich ochráni.',b:'h',why:'[[spoločenská zmluva|Spoločenská zmluva]] podľa Hobbesa: bezpečie za slobodu.'},
 {t:'Zlého panovníka nemožno zvrhnúť – inak príde chaos.',b:'h',why:'Hobbes sa bál občianskej vojny, ktorú zažil.'},
 {t:'Moc panovníka musí byť neobmedzená a nedeliteľná.',b:'h',why:'Leviatan – obrovský štát, ktorý drží spoločnosť pokope.'},
 {t:'Človek má od narodenia právo na život, slobodu a majetok.',b:'l',why:'Locke: [[prirodzené práva]] nie sú dar panovníka.'},
 {t:'Vláda vzniká so súhlasom ľudí, aby chránila ich práva.',b:'l',why:'Locke: zmluva má podmienky.'},
 {t:'Ak vláda porušuje práva ľudí, ľud ju smie vymeniť.',b:'l',why:'Tento argument použili americkí revolucionári v roku 1776.'},
 {t:'Zákonodarná moc má byť oddelená od výkonnej.',b:'l',why:'Locke predbehol Montesquieuovu [[deľba moci|deľbu moci]].'}],
 after:(w,res,ok)=>{w.append(el('div',{class:'bub pop',style:'margin-top:14px'},'Hobbesov argument („bez silnej ruky bude chaos“) počuješ dodnes – od každého, kto chce viac moci. Lockova odpoveď je v každej demokratickej ústave.'));pow();ok();}},ok);}};

T.utopia={n:'Ostrovy snov',ins:'Utopisti snívali o dokonalých krajinách, autori dystopií varovali, ako sa sen môže zvrhnúť. Priraď k autorovi jeho dielo.',

 ['Thomas More (1516)','Utópia – ostrov bez súkromného majetku, každý pracuje šesť hodín denne. Názov znamená „nikde“.'],
 ['Tommaso Campanella (1602)','Mesto slnka – všetko je spoločné, život riadi kňaz-filozof podľa presného plánu.'],

 ()=>mcSeries(after2(box,'Prečo sa sen mení na nočnú moru?'),[{q:'Prečo sa pokusy o dokonalú spoločnosť v 20. storočí často zmenili na útlak?',o:['Ak má byť spoločnosť dokonalá pre všetkých, tí, čo nesúhlasia, sa stanú „prekážkou“ – a začne sa nátlak.','Lebo utopisti boli zlí ľudia.','Lebo dokonalá spoločnosť je príliš drahá.'],w:'Demokracia nesľubuje raj. Sľubuje, že chyby sa dajú opraviť a nikto nemusí žiť podľa cudzieho dokonalého plánu. Preto sú [[dystopia|dystopie]] také dôležité varovania.'}],()=>{pow();ok();}));}};

T.tories={n:'Toryovia vs. whigovia',ins:'Anglicko, koniec 17. storočia. Vznikajú prvé politické strany. Kto by čo povedal?',
run(box,ok){sorter(box,{bins:[{id:'t',label:'🎩 Toryovia'},{id:'w',label:'📜 Whigovia'}],n:nLv(6,8,10),items:[
 {t:'Kráľ má mať silnú moc – je to Boží poriadok.',b:'t',why:'Toryovia stáli pri korune a tradícii.'},
 {t:'Parlament musí kontrolovať kráľa, najmä dane a armádu.',b:'w',why:'Whigovia presadzovali moc parlamentu.'},
 {t:'Jakub je právoplatný dedič trónu, aj keď je katolík. Vylúčiť ho nesmieme.',b:'t',why:'V spore o vylúčenie Jakuba (1679 – 1681) toryovia bránili dedičné právo.'},
 {t:'Katolík Jakub nesmie zdediť trón – ohrozil by naše slobody.',b:'w',why:'Whigovia chceli Jakuba z nástupníctva vylúčiť. Odtiaľ sa začali tieto mená používať.'},
 {t:'Anglikánska cirkev má byť jediná štátna cirkev s výsadami.',b:'t',why:'Spojenie trónu a oltára – program toryov.'},
 {t:'Protestanti mimo štátnej cirkvi majú dostať náboženskú toleranciu.',b:'w',why:'Whigovia podporovali toleranciu pre protestantských „disidentov“.'},
 {t:'Oporou krajiny je vidiecka šľachta a pôda.',b:'t',why:'Toryovia boli silní na vidieku.'},
 {t:'Bohatstvo krajiny je v obchode, banke a mestách.',b:'w',why:'Whigov podporovali kupci a mestá.'},
 {t:'Vláda je zmluva – keď kráľ poruší práva, môže byť nahradený.',b:'w',why:'Lockove myšlienky boli whigovské.'},
 {t:'Osvedčené zvyklosti sú múdrejšie než nové teórie.',b:'t',why:'Základ neskoršieho [[konzervativizmus|konzervativizmu]].'}],
 after:(w,res,ok)=>{w.append(el('div',{class:'bub pop',style:'margin:14px 0 24px'},'Vtipné: obe mená boli nadávky! „Tory“ pochádza z írskeho slova pre psanca a lupiča, „whig“ zo škótskeho výrazu pre vzbúrených presbyteriánov. Strany si ich nakoniec osvojili.'));
  mcSeries(w,[{q:'Prečo bolo prevratné, že sa toryovia a whigovia striedali pri moci?',o:['Porazená strana nebola zničená – zostala v opozícii a čakala na ďalšie voľby.','Lebo jedna strana vždy zakázala druhú.','Lebo o vláde rozhodovala náhoda.'],w:'Vznikla [[lojálna opozícia]]: súper nie je nepriateľ ani zradca. V britskom parlamente sa dodnes hovorí o „lojálnej opozícii Jeho Veličenstva“.'}],()=>{pow();ok();});}},ok);}};

T.lavica={n:'Kto sedí vľavo?',ins:'Paríž, september 1789. Národné zhromaždenie sa háda, či má mať kráľ právo veta. Usaď poslancov: vľavo, alebo vpravo od predsedu?',

T.hlasrok={n:'Kedy dostali hlas?',ins:'Volebné právo pre všetkých nebolo samozrejmosťou. Posuvníkom odhadni rok. Ak sa trafíš do ±8 rokov, je to zásah!',

 const Q=shuffle([{q:'Kedy mohli ženy prvýkrát voliť v celoštátnych voľbách – na Novom Zélande?',y:1893,w:'Nový Zéland, 1893 – prvá krajina sveta.'},

  {q:'Kedy získali ženy volebné právo na celoštátnej úrovni vo Švajčiarsku?',y:1971,w:'Až 1971! V jednom kantóne dokonca až v roku 1990, na príkaz súdu.'}]).slice(0,nLv(3,4,4));
 let i=0,hits=0;const stage=el('div',{});box.append(stage);
 function nx(){stage.innerHTML='';if(i>=Q.length){const w=after2(stage,`Zásahy: ${hits} z ${Q.length}`);w.append(el('div',{class:'bub'},'Všeobecné volebné právo je mladšie, než si myslíš. Mnohí tvoji prapradedovia ešte nemohli voliť, lebo nemali majetok – a prababičky preto, že boli ženy.'));pow();return ok();}
  const q=Q[i];const v=el('div',{class:'bang',style:'font-size:3rem;text-align:center'},'1900');const r=el('input',{type:'range',min:1800,max:2000,value:1900,'aria-label':'Odhad roku',oninput:()=>v.textContent=r.value});const f=el('div',{class:'fb'});
  const b=el('button',{class:'btn',onclick:()=>{const x=+r.value,d=Math.abs(x-q.y),good=d<=8;if(good)hits++;beep(good);r.disabled=true;b.remove();fb(f,good,(good?`Zásah! (rozdiel ${d} ${plural(d,'rok','roky','rokov')}) `:`Vedľa o ${d} ${plural(d,'rok','roky','rokov')}. `)+q.w);
   stage.append(el('button',{class:'btn sm',style:'margin-top:10px',onclick:()=>{i++;nx();}},'Ďalej →'));}},'Overiť');
  stage.append(el('div',{class:'mono tiny',style:'margin-bottom:6px'},`OTÁZKA ${i+1} / ${Q.length}`),el('div',{class:'pq'},q.q),v,r,el('div',{class:'row mono tiny',style:'justify-content:space-between'},el('span',{},'1800'),el('span',{},'2000')),b,f);}
 nx();
}};

 const st={moc:'kral',volby:'ziadne',opozicia:'zakazana',media:'statne',sudy:'posluchaju',sukromie:'ciastocne'};

 function drawT(){tg.innerHTML=ti<targets.length?`🎯 Zadanie ${ti+1} / ${targets.length}: postav štát typu <b>${REG[targets[ti]].n}</b>`:'✔ Všetky zadania splnené! Môžeš sa ešte hrať.';}
 function upd(){const r=REG[cls(st)];vd.innerHTML=`<div class="eyebrow">Vznikol ti</div><h3>${r.n}</h3><details class="vd-more"><summary style="cursor:pointer;font-weight:700">Čo to je? Príklady</summary><p style="margin:6px 0">${r.d}</p><p class="small mut" style="margin:0">Príklady: ${r.ex}</p></details><div class="spec"><i style="left:${r.sc}%"></i></div><div class="row mono tiny" style="justify-content:space-between"><span>DIKTATÚRA</span><span>DEMOKRACIA</span></div>`;
  if(ti<targets.length&&cls(st)===targets[ti]){beep(true);pow('HOTOVO!');fb(f,true,`Splnené: ${r.n}.`);ti++;drawT();if(ti>=targets.length){ok();}}}

}};

  card.append(el('div',{class:'row',style:'justify-content:space-between;align-items:flex-start'},el('div',{class:'eyebrow'},`Úloha ${ids.indexOf(id)+1} / ${ids.length}`),el('button',{class:'btn sm ghost',onclick:()=>run(),title:'Zamieša úlohu nanovo'},'↻ Nový prípad')),

/* ---------- KVÍZ KAPITOLY ---------- */
function quiz(c,card,redraw){

  const w=mc(box,qs[i],first=>{if(first)score++;i++;w.append(el('button',{class:'btn sm',style:'margin-top:10px',onclick:ev=>{ev.currentTarget.remove();nx();}},i<3?'Ďalšia →':'Vyhodnotiť →'));},true);}
 function end(){S.quiz[LV()]=S.quiz[LV()]||{};S.quiz[LV()][c.id]=Math.max(score+1,S.quiz[LV()][c.id]||0);save();redraw();pow('ZACHRÁNENÉ!');
  const nextC=CH[c.no];
  box.append(el('div',{class:'pop',style:'text-align:center;margin-top:16px'},el('div',{class:'mono'},`Výsledok: ${score} / 3`),el('div',{class:'bigstamp'},'STRÁNKA ZACHRÁNENÁ'),
   el('div',{class:'clue'},'🔎 Stopa: '+c.clue),
   el('div',{class:'row',style:'justify-content:center'},nextC?el('button',{class:'btn',onclick:()=>intro(nextC)},`Epizóda ${nextC.no}: ${nextC.name} →`):el('button',{class:'btn red',onclick:exam},'Na skúšku →'),el('button',{class:'btn ghost',onclick:home},'Mapa'),el('button',{class:'btn ghost',onclick:()=>{card.innerHTML='';quiz(c,card,redraw);}},'Kvíz znova'))));}
 nx();
}

/* ---------- SKÚŠKA ---------- */
const AREA=c=>c.no<=4?'Korene demokracie':c.no<=7?'Myslitelia a ideológie':c.no===8?'Pády demokracie':c.no===9?'Režimy a alternatívy':c.no===10?'Manipulácia':'Extrémizmus';
function exam(){
 hush();app.innerHTML='';toTop();
 app.append(el('div',{class:'row',style:'margin-bottom:8px'},el('button',{class:'btn sm ghost',onclick:home},'← Mapa')));
 app.append(el('div',{class:'chhead'},el('div',{class:'tt'},el('div',{class:'eyebrow'},'Záver'),el('h2',{},'Skúška strážcu demokracie'))));
 const card=el('div',{class:'card'});app.append(card);
 const name=el('input',{class:'field',placeholder:'Tvoje meno na osvedčenie (nepovinné)',value:S.name||'',maxlength:40,'aria-label':'Meno'});
 const tm=el('input',{type:'checkbox'});
 card.append(el('p',{style:'margin-top:0'},`12 otázok zo všetkých epizód. Na každú máš jeden pokus. Splnené epizódy na tejto úrovni: ${totalDone()} / ${CH.length} – skúšku však môžeš skúsiť kedykoľvek.`),name,
  el('label',{class:'toggle'},tm,'Časový limit 30 sekúnd na otázku (ako v teste)'),el('div',{class:'row',style:'margin-top:10px'},el('button',{class:'btn red',onclick:start},'Začať skúšku')));
 function start(){S.name=name.value.trim().slice(0,40);save();const timed=tm.checked;
  let pool=[];CH.forEach(c=>shuffle(c.quiz).slice(0,1).forEach(q=>pool.push({q,c})));
  const extra=shuffle(CH.flatMap(c=>c.quiz.map(q=>({q,c})))).filter(x=>!pool.some(p=>p.q===x.q)).slice(0,12-pool.length);
  const Q=shuffle(pool.concat(extra)).slice(0,12);let i=0;const res=[];
  function nx(){card.innerHTML='';if(i>=Q.length)return results(Q,res);
   const{q,c}=Q[i];card.append(el('div',{class:'row',style:'justify-content:space-between'},el('span',{class:'mono small'},`OTÁZKA ${i+1} / ${Q.length}`),el('span',{class:'chip'},AREA(c))));
   let iv=null;const tb=el('div',{class:'qtimer'},el('i',{style:'width:100%'}));if(timed)card.append(tb);
   const box=el('div',{});card.append(box);let answered=false;
   const w=mc(box,q,first=>{answered=true;clearInterval(iv);res[i]=first;i++;w.append(el('button',{class:'btn sm',style:'margin-top:10px',onclick:nx},i<Q.length?'Ďalšia →':'Výsledky →'));},true);
   if(timed){let left=30;iv=setInterval(()=>{left-=.1;tb.firstChild.style.width=Math.max(0,left/30*100)+'%';if(left<=0&&!answered){clearInterval(iv);answered=true;res[i]=false;i++;beep(false);
    w.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.ok==='1')x.classList.add('right');});w.append(el('div',{class:'fb bad'},'⏰ Čas vypršal.'),el('button',{class:'btn sm',style:'margin-top:10px',onclick:nx},i<Q.length?'Ďalšia →':'Výsledky →'));}},100);}
  }
  nx();}
 function results(Q,res){const score=res.filter(Boolean).length;const pct=Math.round(score/Q.length*100);
  const areas={};Q.forEach(({c},j)=>{const a=AREA(c);areas[a]=areas[a]||[0,0];areas[a][1]++;if(res[j])areas[a][0]++;});
  const title=pct>=85?'Strážca demokracie':pct>=60?'Kronikár slobody':'Pútnik demokracie';
  card.append(el('h3',{},`Výsledok: ${score} / ${Q.length} (${pct} %)`),el('div',{class:'areas',style:'margin:12px 0'},...Object.entries(areas).map(([a,[g,t]])=>el('div',{class:'area'},el('span',{},a),el('span',{class:'mono'},`${g}/${t}`),el('div',{class:'meter'},el('i',{style:`width:${g/t*100}%;background:${g/t>=.7?'#51cf66':g/t>=.4?'#fab005':'#ff6b6b'}`}))))));
  const d=new Date();const date=`${d.getDate()}. ${d.getMonth()+1}. ${d.getFullYear()}`;
  const seal=`<svg class="seal" viewBox="0 0 100 100"><path d="M50 4 61 16 77 12 80 28 95 35 88 50 95 65 80 72 77 88 61 84 50 96 39 84 23 88 20 72 5 65 12 50 5 35 20 28 23 12 39 16Z" fill="#ffd43b" stroke="#141414" stroke-width="3"/><circle cx="50" cy="50" r="27" fill="#fff" stroke="#141414" stroke-width="3"/><path d="M36 44 50 35l14 9z" fill="#ff4d4d" stroke="#141414" stroke-width="2"/><g fill="#141414"><rect x="39" y="47" width="4" height="13"/><rect x="48" y="47" width="4" height="13"/><rect x="57" y="47" width="4" height="13"/><rect x="35" y="61" width="30" height="4"/></g></svg>`;
  card.append(el('div',{class:'cert',id:'cert'},el('div',{html:seal}),el('div',{class:'eyebrow'},'Osvedčenie · Lekcie demokracie'),el('h2',{},title.toUpperCase()),el('div',{class:'nm'},S.name||'Statočný cestovateľ časom'),
   el('p',{},`zachránil(a) stránky Archívu času na úrovni ${LEVELS[LV()].name} a v záverečnej skúške dosiahol(a) ${score} z ${Q.length} bodov (${pct} %).`),
   el('p',{class:'small mut'},`${date} · Zavretá škola`)),
   el('div',{class:'row',style:'margin-top:14px'},el('button',{class:'btn',onclick:()=>window.print()},'🖨 Vytlačiť osvedčenie'),el('button',{class:'btn ghost',onclick:exam},'Skúsiť znova'),el('button',{class:'btn ghost',onclick:home},'Mapa')));
  pow(pct>=60?'BRAVO!':'ŇUF!');}
}
